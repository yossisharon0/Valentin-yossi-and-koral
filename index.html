<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>קורל 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

/* ===== RESET & GLOBAL ===== */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--color-primary:#ff2e63;
--color-primary-dark:#d81e4f;
--color-secondary:#ff6b9d;
--color-accent:#ffafcc;
--color-bg-start:#0a0015;
--color-bg-end:#1a0520;
--color-white:rgba(255,255,255,0.95);
--color-glass:rgba(255,255,255,0.08);
--transition-smooth:cubic-bezier(0.4, 0, 0.2, 1);
--transition-bounce:cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

body{
font-family:'Heebo',sans-serif;
min-height:100vh;
overflow:hidden;
background:linear-gradient(135deg, var(--color-bg-start), var(--color-bg-end));
color:var(--color-white);
position:relative;
cursor:default;
}

/* ===== CANVAS LAYERS ===== */
#mainCanvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:1;
pointer-events:none;
}

/* ===== INTRO SCENE ===== */
.scene{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:10;
opacity:0;
pointer-events:none;
transition:opacity 1.5s var(--transition-smooth);
}

.scene.active{
opacity:1;
pointer-events:auto;
}

#introScene{
background:radial-gradient(circle at center, rgba(255,46,99,0.15), transparent 70%);
}

.intro-content{
text-align:center;
transform:scale(0.9);
transition:transform 2s var(--transition-smooth);
}

#introScene.active .intro-content{
transform:scale(1);
}

.intro-icon{
font-size:clamp(60px, 12vw, 100px);
margin-bottom:30px;
animation:gentlePulse 3s ease-in-out infinite;
filter:drop-shadow(0 0 30px var(--color-primary));
}

@keyframes gentlePulse{
0%, 100%{transform:scale(1);}
50%{transform:scale(1.08);}
}

.intro-text{
font-size:clamp(18px, 3.5vw, 26px);
font-weight:300;
letter-spacing:3px;
opacity:0.9;
margin-bottom:40px;
}

.tap-hint{
font-size:clamp(14px, 2.5vw, 18px);
opacity:0.6;
animation:fadeInOut 2s ease-in-out infinite;
margin-top:20px;
}

@keyframes fadeInOut{
0%, 100%{opacity:0.4;}
50%{opacity:0.8;}
}

/* ===== MAIN SCENE ===== */
#mainScene{
padding:20px;
}

.card{
backdrop-filter:blur(30px) saturate(180%);
background:var(--color-glass);
border:1px solid rgba(255,255,255,0.18);
border-radius:30px;
padding:clamp(30px, 6vw, 60px);
max-width:600px;
width:90%;
box-shadow:
0 8px 32px rgba(0,0,0,0.3),
0 0 60px rgba(255,46,99,0.2),
inset 0 0 40px rgba(255,255,255,0.05);
text-align:center;
transform:translateY(30px);
opacity:0;
transition:all 1.2s var(--transition-smooth);
}

#mainScene.active .card{
transform:translateY(0);
opacity:1;
}

.card-title{
font-size:clamp(24px, 5vw, 36px);
font-weight:800;
line-height:1.5;
margin-bottom:25px;
background:linear-gradient(135deg, var(--color-white), var(--color-accent));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-clip:text;
text-shadow:0 2px 20px rgba(255,46,99,0.3);
}

.countdown{
font-size:clamp(14px, 2.8vw, 17px);
font-weight:400;
opacity:0.85;
background:rgba(255,46,99,0.15);
border:1px solid rgba(255,46,99,0.3);
padding:18px 25px;
border-radius:18px;
margin-bottom:35px;
line-height:1.6;
}

/* ===== BUTTONS ===== */
.button-container{
display:flex;
flex-direction:column;
gap:15px;
margin:30px 0;
align-items:center;
position:relative; /* חשוב בשביל הכפתור "לא" */
}

.btn{
position:relative;
padding:16px 50px;
font-size:clamp(18px, 3.5vw, 22px);
font-weight:600;
border:none;
border-radius:50px;
cursor:pointer;
transition:all 0.3s var(--transition-smooth);
font-family:'Heebo',sans-serif;
letter-spacing:0.5px;
outline:none;
-webkit-tap-highlight-color:transparent;
}

#yesBtn{
background:linear-gradient(135deg, var(--color-primary), var(--color-secondary));
color:white;
box-shadow:
0 8px 25px rgba(255,46,99,0.4),
inset 0 1px 0 rgba(255,255,255,0.3);
order:1;
}

#yesBtn:hover{
transform:translateY(-4px) scale(1.03);
box-shadow:
0 12px 35px rgba(255,46,99,0.6),
inset 0 1px 0 rgba(255,255,255,0.3);
}

#yesBtn:active{
transform:translateY(-2px) scale(1.01);
}

#noBtn{
background:rgba(255,255,255,0.12);
color:var(--color-white);
border:1px solid rgba(255,255,255,0.3);
box-shadow:0 4px 15px rgba(0,0,0,0.2);
opacity:0.7;
order:2;
cursor:not-allowed;
}

#noBtn:hover{
opacity:0.5;
transform:scale(0.98);
}

.btn-hint{
font-size:clamp(12px, 2.2vw, 14px);
opacity:0.5;
margin-top:5px;
font-weight:300;
}

/* ===== SUCCESS SCENE ===== */
#successScene{
background:linear-gradient(135deg, rgba(255,46,99,0.3), rgba(255,107,157,0.2));
}

.success-content{
text-align:center;
max-width:600px;
padding:20px;
}

.success-heart{
font-size:clamp(80px, 15vw, 120px);
margin-bottom:30px;
animation:heartBeat 1.2s ease-in-out infinite;
filter:drop-shadow(0 0 40px var(--color-primary));
}

@keyframes heartBeat{
0%, 100%{transform:scale(1);}
25%{transform:scale(1.15);}
50%{transform:scale(1.05);}
75%{transform:scale(1.2);}
}

.success-message{
font-size:clamp(20px, 4vw, 28px);
font-weight:600;
line-height:1.8;
margin-bottom:35px;
opacity:0;
animation:fadeInUp 1s var(--transition-smooth) 0.5s forwards;
}

@keyframes fadeInUp{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

.success-image{
width:80%;           /* קטנה יותר */
max-width:300px;     /* קטנה יותר */
border-radius:25px;
border:3px solid rgba(255,255,255,0.4);
box-shadow:0 15px 50px rgba(0,0,0,0.4), 0 0 60px rgba(255,46,99,0.3);
margin:0 auto;
display:block;
opacity:0;
animation:fadeInUp 1s var(--transition-smooth) 1s forwards;
}

/* ===== LOVE QUOTES ===== */
.love-quote{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%, -50%);
font-size:clamp(22px, 4vw, 38px);
font-weight:300;
color:rgba(255,255,255,0.12);
text-align:center;
z-index:0;
pointer-events:none;
letter-spacing:2px;
max-width:80vw;
white-space:nowrap;
opacity:0;
transition:opacity 2s var(--transition-smooth);
}

.love-quote.visible{
opacity:1;
}

/* ===== DIMMING OVERLAY ===== */
.dim-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
z-index:9;
opacity:0;
pointer-events:none;
transition:opacity 1s var(--transition-smooth);
}

.dim-overlay.active{
opacity:1;
}

/* ===== RESPONSIVE ===== */
@media (min-width:768px){
.button-container{
flex-direction:row;
justify-content:center;
}
#yesBtn{order:1;}
#noBtn{order:2;}
}

@media (max-height:700px){
.card{padding:25px;}
.card-title{margin-bottom:15px;}
.countdown{margin-bottom:20px; padding:12px 20px;}
.button-container{margin:20px 0; gap:12px;}
}

@media (max-width:400px){
.btn{padding:14px 40px;}
}

/* ===== UTILITY ===== */
.hidden{
display:none !important;
}

</style>
</head>

<body>

<div class="love-quote" id="loveQuote"></div>
<div class="dim-overlay" id="dimOverlay"></div>

<div class="scene active" id="introScene">

<div class="intro-icon">💖</div>

</div>

<div class="success-content">

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קורל ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Heebo',sans-serif;}
body{
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

/* Love quotes background */
#loveBg{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    opacity:0.06;
    font-weight:800;
    text-align:center;
    pointer-events:none;
    transition:1s;
}

/* Scenes */
.scene{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    opacity:0;
    pointer-events:none;
    transition:1.5s;
}
.scene.active{opacity:1;pointer-events:auto;}

.card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(25px);
    padding:60px 40px;
    border-radius:30px;
    border:1px solid rgba(255,255,255,0.2);
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

h2{margin-bottom:20px;}
.countdown{margin:20px 0;font-size:18px;opacity:0.8;}

.buttons{position:relative;height:60px;}
button{
    padding:14px 40px;
    border:none;
    border-radius:40px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}
#yes{
    background:linear-gradient(135deg,#ff2e63,#ff6b9d);
    color:white;
    font-weight:600;
}
#yes:hover{transform:scale(1.08);}
#no{
    position:absolute;
    background:rgba(255,255,255,0.15);
    color:white;
    border:1px solid rgba(255,255,255,0.4);
}

/* Success */
#success{
    text-align:center;
}
#success h1{
    font-size:60px;
    margin-bottom:20px;
}
#success img{
    width:280px;
    border-radius:20px;
    margin-top:30px;
    box-shadow:0 20px 60px rgba(0,0,0,0.7);
    opacity:0;
    transform:scale(1.2);
    transition:2s;
}
#success.show img{
    opacity:1;
    transform:scale(1);
}

/* Flash effect */
#flash{
    position:fixed;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
    transition:0.4s;
}
#flash.active{opacity:1;}

.heart{
    position:absolute;
    bottom:-20px;
    animation:rise 6s linear infinite;
}
@keyframes rise{
    from{transform:translateY(0);opacity:1;}
    to{transform:translateY(-110vh);opacity:0;}
}
</style>
</head>

<body>

<div id="loveBg"></div>
<div id="flash"></div>

<audio id="music" src="song.mp3"></audio>

<div class="scene active" id="question">
    <div class="card">
        <h2>קורל חיים שלי ❤️<br>את פנויה ביום האהבה?</h2>
        <div class="countdown" id="countdown"></div>
        <div class="buttons">
            <button id="yes">כן 😍</button>
            <button id="no">לא 🙄</button>
        </div>
    </div>
</div>

<div class="scene" id="success">
    <h1>ידעתי שתבחרי נכון 💕</h1>
    <img src="image.JPG">
</div>

<script>
const yes=document.getElementById("yes");
const no=document.getElementById("no");
const success=document.getElementById("success");
const question=document.getElementById("question");
const music=document.getElementById("music");
const flash=document.getElementById("flash");
const loveBg=document.getElementById("loveBg");

/* Countdown to 14.02 */
function updateCountdown(){
    const now=new Date();
    let year=now.getFullYear();
    let target=new Date(year,1,14,0,0,0);
    if(now>target) target=new Date(year+1,1,14,0,0,0);
    const diff=target-now;

    const d=Math.floor(diff/(1000*60*60*24));
    const h=Math.floor((diff/(1000*60*60))%24);
    const m=Math.floor((diff/1000/60)%60);
    const s=Math.floor((diff/1000)%60);

    document.getElementById("countdown").innerHTML=
        `עוד ${d} ימים ${h} שעות ${m} דקות ${s} שניות ❤️`;
}
setInterval(updateCountdown,1000);
updateCountdown();

/* Moving NO */
function moveNo(){
    const maxX=window.innerWidth-no.offsetWidth;
    const maxY=window.innerHeight-no.offsetHeight;
    no.style.left=Math.random()*maxX+"px";
    no.style.top=Math.random()*maxY+"px";
}
no.addEventListener("mouseenter",moveNo);
no.addEventListener("touchstart",moveNo);

/* Love quotes rotating */
const quotes=[
"את הסיפור אהבה הכי יפה שלי",
"כל יום איתך הוא מתנה",
"הלב שלי בחר בך",
"את הבית שלי",
"אני ואת זה לנצח"
];
let qi=0;
setInterval(()=>{
    loveBg.innerText=quotes[qi];
    qi=(qi+1)%quotes.length;
},3000);

/* YES click */
yes.addEventListener("click",()=>{
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    flash.classList.add("active");
    setTimeout(()=>flash.classList.remove("active"),400);

    music.play();
    question.classList.remove("active");
    success.classList.add("active");
    success.classList.add("show");

    setInterval(()=>{
        const heart=document.createElement("div");
        heart.className="heart";
        heart.innerHTML="💖";
        heart.style.left=Math.random()*100+"vw";
        heart.style.fontSize=(20+Math.random()*20)+"px";
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),6000);
    },500);
});
</script>

</body>
</html>

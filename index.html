<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>קורל 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet">

<style>

/* ==================== RESET & VARIABLES ==================== */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--primary:#ff2e63;
--primary-dark:#d81e4f;
--secondary:#ff6b9d;
--accent:#ffafcc;
--bg-night-start:#0a0015;
--bg-night-end:#1a0520;
--bg-day-start:#1a0520;
--bg-day-end:#2d1b3d;
--white:rgba(255,255,255,0.95);
--glass:rgba(255,255,255,0.08);
--transition:cubic-bezier(0.4, 0, 0.2, 1);
--bounce:cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

body{
font-family:'Heebo',sans-serif;
min-height:100vh;
overflow:hidden;
background:linear-gradient(135deg, var(--bg-night-start), var(--bg-night-end));
color:var(--white);
position:relative;
transition:background 3s ease;
}

/* ==================== CANVAS ==================== */
#mainCanvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:1;
pointer-events:none;
}

/* ==================== FILM GRAIN OVERLAY ==================== */
.grain-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background-image:url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noise)" opacity="0.05"/%3E%3C/svg%3E');
opacity:0;
pointer-events:none;
z-index:100;
transition:opacity 2s ease;
}

.grain-overlay.active{
opacity:1;
}

/* ==================== VIGNETTE ==================== */
.vignette{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.7) 100%);
opacity:0;
pointer-events:none;
z-index:99;
transition:opacity 2s ease;
}

.vignette.active{
opacity:1;
}

/* ==================== SCENES ==================== */
.scene{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:10;
opacity:0;
pointer-events:none;
transition:opacity 1.5s var(--transition);
}

.scene.active{
opacity:1;
pointer-events:auto;
}

/* ==================== INTRO SCENE ==================== */
#introScene{
background:radial-gradient(circle at center, rgba(255,46,99,0.15), transparent 70%);
}

.intro-content{
text-align:center;
transform:scale(0.9);
transition:transform 2.5s var(--transition);
}

#introScene.active .intro-content{
transform:scale(1);
}

.intro-icon{
font-size:clamp(70px, 14vw, 110px);
margin-bottom:35px;
animation:gentlePulse 3.5s ease-in-out infinite;
filter:drop-shadow(0 0 35px var(--primary));
}

@keyframes gentlePulse{
0%, 100%{transform:scale(1);}
50%{transform:scale(1.06);}
}

.intro-text{
font-size:clamp(20px, 4vw, 28px);
font-weight:300;
letter-spacing:4px;
opacity:0.9;
margin-bottom:50px;
}

.tap-hint{
font-size:clamp(15px, 2.8vw, 19px);
opacity:0.6;
animation:fadeInOut 2.5s ease-in-out infinite;
margin-top:25px;
font-weight:300;
}

@keyframes fadeInOut{
0%, 100%{opacity:0.35;}
50%{opacity:0.85;}
}

/* ==================== MAIN SCENE ==================== */
#mainScene{
padding:20px;
}

.card{
backdrop-filter:blur(35px) saturate(180%);
background:var(--glass);
border:1px solid rgba(255,255,255,0.2);
border-radius:35px;
padding:clamp(35px, 7vw, 70px);
max-width:650px;
width:92%;
box-shadow:
0 12px 40px rgba(0,0,0,0.4),
0 0 80px rgba(255,46,99,0.25),
inset 0 0 50px rgba(255,255,255,0.06);
text-align:center;
transform:translateY(40px);
opacity:0;
transition:all 1.5s var(--transition);
position:relative;
}

#mainScene.active .card{
transform:translateY(0);
opacity:1;
}

.card-title{
font-size:clamp(26px, 5.5vw, 40px);
font-weight:800;
line-height:1.6;
margin-bottom:30px;
background:linear-gradient(135deg, var(--white), var(--accent));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-clip:text;
filter:drop-shadow(0 2px 25px rgba(255,46,99,0.35));
}

.countdown{
font-size:clamp(15px, 3vw, 18px);
font-weight:400;
opacity:0.88;
background:rgba(255,46,99,0.18);
border:1px solid rgba(255,46,99,0.35);
padding:20px 28px;
border-radius:20px;
margin-bottom:40px;
line-height:1.7;
}

/* ==================== BUTTONS WITH MICRO-INTERACTIONS ==================== */
.button-container{
display:flex;
flex-direction:column;
gap:18px;
margin:35px 0;
align-items:center;
position:relative;
min-height:140px;
}

.btn{
position:relative;
padding:18px 55px;
font-size:clamp(19px, 3.8vw, 24px);
font-weight:600;
border:none;
border-radius:50px;
cursor:pointer;
transition:all 0.4s var(--transition);
font-family:'Heebo',sans-serif;
letter-spacing:0.8px;
outline:none;
-webkit-tap-highlight-color:transparent;
overflow:hidden;
z-index:1;
}

/* Ripple effect container */
.btn::before{
content:'';
position:absolute;
top:50%;
left:50%;
width:0;
height:0;
border-radius:50%;
background:rgba(255,255,255,0.5);
transform:translate(-50%, -50%);
transition:width 0.6s, height 0.6s;
}

.btn.ripple::before{
width:300px;
height:300px;
}

/* Light sweep effect */
.btn::after{
content:'';
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
transition:left 0.7s;
}

.btn:hover::after{
left:100%;
}

#yesBtn{
background:linear-gradient(135deg, var(--primary), var(--secondary));
color:white;
box-shadow:
0 10px 30px rgba(255,46,99,0.45),
inset 0 1px 0 rgba(255,255,255,0.35);
order:1;
}

#yesBtn:hover{
transform:translateY(-5px) scale(1.04);
box-shadow:
0 15px 45px rgba(255,46,99,0.65),
inset 0 1px 0 rgba(255,255,255,0.35);
}

#yesBtn:active{
transform:translateY(-3px) scale(1.02);
}

#noBtn{
position:absolute;
background:rgba(255,255,255,0.13);
color:var(--white);
border:1px solid rgba(255,255,255,0.35);
box-shadow:0 6px 20px rgba(0,0,0,0.25);
opacity:0.75;
cursor:pointer;
transition:all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
order:2;
}

#noBtn.escaping{
opacity:0.6;
}

#noBtn.defeated{
transform:scale(0.85);
opacity:0.4;
filter:blur(1px);
pointer-events:none;
}

.btn-hint{
font-size:clamp(13px, 2.4vw, 15px);
opacity:0.52;
margin-top:8px;
font-weight:300;
}

/* ==================== DIM OVERLAY ==================== */
.dim-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.75);
z-index:9;
opacity:0;
pointer-events:none;
transition:opacity 1.2s var(--transition);
}

.dim-overlay.active{
opacity:1;
}

/* ==================== SUCCESS SCENE - CINEMATIC ==================== */
#successScene{
background:transparent;
}

.success-content{
text-align:center;
max-width:700px;
padding:25px;
position:relative;
}

/* Stage 1: Name reveal */
.success-name{
font-family:'Crimson Text', serif;
font-size:clamp(50px, 12vw, 90px);
font-weight:600;
margin-bottom:40px;
opacity:0;
transform:scale(0.85);
transition:all 2s var(--transition);
background:linear-gradient(135deg, #fff, #ffafcc);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-clip:text;
filter:drop-shadow(0 0 50px rgba(255,46,99,0.7));
letter-spacing:3px;
}

.success-name.visible{
opacity:1;
transform:scale(1);
}

/* Stage 2: Message typewriter */
.success-message{
font-size:clamp(22px, 4.5vw, 32px);
font-weight:400;
line-height:2;
margin-bottom:50px;
opacity:0;
min-height:80px;
font-family:'Heebo', sans-serif;
}

.success-message.visible{
opacity:1;
}

/* Stage 3: Cinematic image reveal */
.image-container{
position:relative;
display:inline-block;
opacity:0;
transform:scale(1.15);
filter:blur(20px);
transition:all 2.5s var(--transition);
}

.image-container.visible{
opacity:1;
transform:scale(1);
filter:blur(0);
}

.image-frame{
position:relative;
padding:15px;
background:rgba(255,255,255,0.1);
backdrop-filter:blur(25px);
border-radius:30px;
border:2px solid rgba(255,255,255,0.25);
box-shadow:
0 25px 80px rgba(0,0,0,0.6),
0 0 100px rgba(255,46,99,0.4),
inset 0 0 60px rgba(255,255,255,0.08);
}

.success-image{
width:100%;
max-width:400px;
border-radius:20px;
display:block;
box-shadow:0 15px 50px rgba(0,0,0,0.5);
}

/* Reflection effect under image */
.image-reflection{
position:absolute;
bottom:-50px;
left:50%;
transform:translateX(-50%) scaleY(-1);
width:90%;
height:50px;
background:linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
filter:blur(10px);
opacity:0.4;
border-radius:20px;
pointer-events:none;
}

/* ==================== LOVE QUOTES BACKGROUND ==================== */
.love-quote{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%, -50%);
font-size:clamp(24px, 4.5vw, 42px);
font-weight:300;
color:rgba(255,255,255,0.12);
text-align:center;
z-index:0;
pointer-events:none;
letter-spacing:3px;
max-width:85vw;
white-space:nowrap;
opacity:0;
transition:opacity 2.5s var(--transition);
}

.love-quote.visible{
opacity:1;
}

/* ==================== RESPONSIVE ==================== */
@media (min-width:768px){
.button-container{
flex-direction:row;
justify-content:center;
}
}

@media (max-height:750px){
.card{padding:30px;}
.card-title{margin-bottom:20px;}
.countdown{margin-bottom:25px; padding:15px 22px;}
.button-container{margin:25px 0; gap:15px; min-height:100px;}
}

@media (max-width:400px){
.btn{padding:16px 45px;}
}

/* ==================== UTILITY ==================== */
.hidden{
display:none !important;
}

</style>
</head>

</div>
</div>

<div class="scene" id="mainScene">

<div class="button-container" id="buttonContainer">

<button class="btn" id="noBtn">לא 🙄</button>
</div>
<div class="btn-hint">רמז: יש רק תשובה נכונה אחת 😉</div>
</div>
</div>

<!-- SCENE 3: Success - Cinematic -->
<div class="scene" id="successScene">
<div class="success-content">
<div class="success-name" id="successName">קורל</div>
<div class="success-message" id="successMessage"></div>
<div class="image-container" id="imageContainer">
<div class="image-frame">
<img class="success-image" src="image.JPG" alt="קורל ואני">
<div class="image-reflection"></div>
</div>
</div>
</div>
</div>

<audio id="bgMusic" src="song.mp3" preload="auto"></audio>

<script>

// ============================================
// CONFIGURATION
// ============================================

const CONFIG = {
targetDate: new Date("Feb 14, 2026 00:00:00").getTime(),
loveQuotes: [
"את האור בחיים שלי ✨",
"כל רגע איתך הוא קסם 💫",
"את הופכת את החיים שלי למושלמים 💕",
"אני מאושר שאת שלי 💖",
"את החלום שהתגשם 🌟",
"אהבתי אליך אינסופית 💗",
"את הכל בשבילי ❤️",
"יחד אנחנו בלתי מנוצחים 👑"
],
successMessage: "ידעתי שתגידי כן 😍\nביום האהבה אני רוצה להיות רק איתך 🥰\n(שבוע אחרי כי אני במילואים 😉)",
particleColors: ['#ff2e63', '#ff6b9d', '#ffafcc', '#ffc2d1'],
isMobile: window.innerWidth < 768,
};

// ============================================
// STATE MANAGEMENT
// ============================================

const STATE = {
currentScene: 'intro',
particleSystem: null,
animationFrame: null,
quoteIndex: 0,
quoteInterval: null,
noButtonEscapeCount: 0,
mouseX: 0,
mouseY: 0,
isSlowMotion: false,
timeOfDay: 'night' // will be calculated
};

// ============================================
// DOM ELEMENTS
// ============================================

const DOM = {
canvas: document.getElementById('mainCanvas'),
introScene: document.getElementById('introScene'),
mainScene: document.getElementById('mainScene'),
successScene: document.getElementById('successScene'),
loveQuote: document.getElementById('loveQuote'),
dimOverlay: document.getElementById('dimOverlay'),
grainOverlay: document.getElementById('grainOverlay'),
vignetteOverlay: document.getElementById('vignetteOverlay'),
countdown: document.getElementById('countdown'),
yesBtn: document.getElementById('yesBtn'),
noBtn: document.getElementById('noBtn'),
buttonContainer: document.getElementById('buttonContainer'),
successName: document.getElementById('successName'),
successMessage: document.getElementById('successMessage'),
imageContainer: document.getElementById('imageContainer'),
bgMusic: document.getElementById('bgMusic')
};

const ctx = DOM.canvas.getContext('2d');

// ============================================
// TIME OF DAY DETECTION
// ============================================

function detectTimeOfDay() {
const hour = new Date().getHours();
  
if (hour >= 6 && hour < 18) {
// Day time
STATE.timeOfDay = 'day';
document.documentElement.style.setProperty('--bg-night-start', '#1a0520');
document.documentElement.style.setProperty('--bg-night-end', '#2d1b3d');
return 'day';
} else {
// Night time
STATE.timeOfDay = 'night';
document.documentElement.style.setProperty('--bg-night-start', '#0a0015');
document.documentElement.style.setProperty('--bg-night-end', '#1a0520');
return 'night';
}
}

// ============================================
// PARTICLE SYSTEM WITH PARALLAX LAYERS
// ============================================

class Particle {
constructor(x, y, type = 'star', layer = 'mid') {
this.x = x;
this.y = y;
this.type = type;
this.layer = layer; // 'back', 'mid', 'front'
    
// Layer-based properties for parallax
const layerConfig = {
back: { size: 0.8, speed: 0.15, alpha: 0.3 },
mid: { size: 1.2, speed: 0.4, alpha: 0.6 },
front: { size: 2, speed: 0.7, alpha: 0.8 }
};
    
const config = layerConfig[layer] || layerConfig.mid;
    
this.baseSize = (Math.random() * 1.5 + 0.5) * config.size;
this.size = this.baseSize;
this.baseSpeed = (Math.random() * 0.3 + 0.2) * config.speed;
this.speedY = this.baseSpeed;
this.speedX = 0;
this.baseAlpha = config.alpha;
this.alpha = this.baseAlpha * (Math.random() * 0.4 + 0.6);
this.color = 'white';
this.parallaxOffsetX = 0;
this.parallaxOffsetY = 0;
    
if (type === 'firework') {
const angle = Math.random() * Math.PI * 2;
const speed = Math.random() * 5 + 2;
this.speedX = Math.cos(angle) * speed;
this.speedY = Math.sin(angle) * speed;
this.gravity = 0.1;
this.friction = 0.97;
this.life = 1;
this.decay = Math.random() * 0.018 + 0.012;
this.size = Math.random() * 3.5 + 2;
this.color = CONFIG.particleColors[Math.floor(Math.random() * CONFIG.particleColors.length)];
}
    
if (type === 'heart') {
this.speedX = (Math.random() - 0.5) * 2.5;
this.speedY = Math.random() * -2.5 - 1;
this.gravity = 0.06;
this.life = 1;
this.decay = 0.009;
this.size = Math.random() * 18 + 12;
this.char = '💖';
this.rotation = Math.random() * Math.PI * 2;
this.rotationSpeed = (Math.random() - 0.5) * 0.05;
}
}

update() {
// Apply slow motion effect
const speedMultiplier = STATE.isSlowMotion ? 0.3 : 1;
    
if (this.type === 'star') {
// Apply parallax offset based on mouse position
const parallaxStrength = this.layer === 'back' ? 0.02 : this.layer === 'mid' ? 0.05 : 0.1;
this.parallaxOffsetX = (STATE.mouseX - DOM.canvas.width / 2) * parallaxStrength;
this.parallaxOffsetY = (STATE.mouseY - DOM.canvas.height / 2) * parallaxStrength;
      
this.y += this.speedY * speedMultiplier;
if (this.y > DOM.canvas.height) {
this.y = -10;
this.x = Math.random() * DOM.canvas.width;
}
      
// Twinkling effect
this.alpha = this.baseAlpha * (Math.sin(Date.now() * 0.001 + this.x * 0.01) * 0.3 + 0.7);
}
    
if (this.type === 'firework') {
this.speedY += this.gravity * speedMultiplier;
this.speedX *= this.friction;
this.speedY *= this.friction;
this.x += this.speedX * speedMultiplier;
this.y += this.speedY * speedMultiplier;
this.life -= this.decay * speedMultiplier;
}
    
if (this.type === 'heart') {
this.speedY += this.gravity * speedMultiplier;
this.x += this.speedX * speedMultiplier;
this.y += this.speedY * speedMultiplier;
this.life -= this.decay * speedMultiplier;
this.rotation += this.rotationSpeed * speedMultiplier;
}
}

draw(ctx) {
if (this.life !== undefined && this.life <= 0) return;
    
ctx.save();
ctx.globalAlpha = this.type === 'star' ? this.alpha : this.life;
    
if (this.type === 'heart') {
ctx.font = `${this.size}px Arial`;
ctx.translate(this.x, this.y);
ctx.rotate(this.rotation);
ctx.fillText(this.char, 0, 0);
} else {
const drawX = this.type === 'star' ? this.x + this.parallaxOffsetX : this.x;
const drawY = this.type === 'star' ? this.y + this.parallaxOffsetY : this.y;
      
ctx.fillStyle = this.color;
ctx.beginPath();
ctx.arc(drawX, drawY, this.size, 0, Math.PI * 2);
ctx.fill();
      
if (this.type === 'firework') {
ctx.shadowBlur = 15;
ctx.shadowColor = this.color;
}
}
    
ctx.restore();
}

isDead() {
return this.life !== undefined && this.life <= 0;
}
}

class ParticleSystem {
constructor() {
this.particles = [];
this.maxParticles = CONFIG.isMobile ? 200 : 400;
this.init();
}

init() {
const layers = ['back', 'mid', 'front'];
const particlesPerLayer = Math.floor(this.maxParticles / 3);
    
layers.forEach((layer, index) => {
for (let i = 0; i < particlesPerLayer; i++) {
this.particles.push(new Particle(
Math.random() * DOM.canvas.width,
Math.random() * DOM.canvas.height,
'star',
layer
));
}
});
}

addFirework(x, y) {
const count = CONFIG.isMobile ? 30 : 50;
for (let i = 0; i < count; i++) {
if (this.particles.length < this.maxParticles + 100) {
this.particles.push(new Particle(x, y, 'firework'));
}
}
}

addHeart(x, y) {
if (this.particles.length < this.maxParticles + 50) {
this.particles.push(new Particle(x, y, 'heart'));
}
}

update() {
this.particles.forEach(p => p.update());
    
// Clean up dead particles but keep stars
this.particles = this.particles.filter(p => !p.isDead() || p.type === 'star');
}

draw() {
// Draw in layer order: back -> mid -> front
['back', 'mid', 'front'].forEach(layer => {
this.particles
.filter(p => p.layer === layer || p.type !== 'star')
.forEach(p => p.draw(ctx));
});
}

setSlowMotion(enabled) {
STATE.isSlowMotion = enabled;
}
}

// ============================================
// CANVAS MANAGEMENT
// ============================================

function resizeCanvas() {
DOM.canvas.width = window.innerWidth;
DOM.canvas.height = window.innerHeight;
}

function animate() {
ctx.clearRect(0, 0, DOM.canvas.width, DOM.canvas.height);
  
if (STATE.particleSystem) {
STATE.particleSystem.update();
STATE.particleSystem.draw();
}
  
STATE.animationFrame = requestAnimationFrame(animate);
}

// ============================================
// MOUSE TRACKING FOR PARALLAX
// ============================================

function trackMouse(e) {
STATE.mouseX = e.clientX;
STATE.mouseY = e.clientY;
}

function trackTouch(e) {
if (e.touches.length > 0) {
STATE.mouseX = e.touches[0].clientX;
STATE.mouseY = e.touches[0].clientY;
}
}

setTimeout(() => {
DOM.loveQuote.textContent = CONFIG.loveQuotes[STATE.quoteIndex];
DOM.loveQuote.classList.add('visible');
STATE.quoteIndex = (STATE.quoteIndex + 1) % CONFIG.loveQuotes.length;
}, 2000);
}

function startLoveQuotes() {
updateLoveQuote();
STATE.quoteInterval = setInterval(updateLoveQuote, 8000);
}

function stopLoveQuotes() {
if (STATE.quoteInterval) {
clearInterval(STATE.quoteInterval);
STATE.quoteInterval = null;
}
DOM.loveQuote.classList.remove('visible');
}

// ============================================
// COUNTDOWN TIMER
// ============================================

function updateCountdown() {
const now = Date.now();
const diff = CONFIG.targetDate - now;

if (diff <= 0) {
DOM.countdown.innerHTML = "היום זה היום שלנו 💘";
return;
}

const days = Math.floor(diff / (1000 * 60 * 60 * 24));
const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
const minutes = Math.floor((diff / (1000 * 60)) % 60);

DOM.countdown.innerHTML =
`עוד ${days} ימים, ${hours} שעות ו-${minutes} דקות<br>ליום האהבה שלנו 💕`;
}

// ============================================
// TYPEWRITER EFFECT
// ============================================

function typeWriter(element, text, speed = 45) {
return new Promise(resolve => {
let i = 0;
element.textContent = '';
element.classList.add('visible');

function typing() {
if (i < text.length) {
element.textContent += text.charAt(i);
i++;
setTimeout(typing, speed);
} else {
resolve();
}
}
typing();
});
}

// ============================================
// NO BUTTON ESCAPE SYSTEM
// ============================================

function moveNoButton() {
if (STATE.noButtonEscapeCount >= 5) {
DOM.noBtn.classList.add('defeated');
return;
}

STATE.noButtonEscapeCount++;

const containerRect = DOM.buttonContainer.getBoundingClientRect();
const btnRect = DOM.noBtn.getBoundingClientRect();

const maxX = containerRect.width - btnRect.width;
const maxY = containerRect.height - btnRect.height;

const randomX = Math.random() * maxX - (containerRect.width / 4);
const randomY = Math.random() * maxY - (containerRect.height / 4);

DOM.noBtn.classList.add('escaping');
DOM.noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;

setTimeout(() => {
DOM.noBtn.classList.remove('escaping');
}, 300);
}

function handleNoProximity(e) {
if (STATE.noButtonEscapeCount >= 5) return;

const rect = DOM.noBtn.getBoundingClientRect();
const distance = Math.hypot(
e.clientX - (rect.left + rect.width / 2),
e.clientY - (rect.top + rect.height / 2)
);

if (distance < 120) {
moveNoButton();
}
}

// ============================================
// RIPPLE EFFECT
// ============================================

function addRippleEffect(e) {
const button = e.currentTarget;
button.classList.add('ripple');
setTimeout(() => button.classList.remove('ripple'), 600);
}

// ============================================
// SCENE TRANSITIONS
// ============================================

function switchScene(from, to, callback) {
DOM[from + 'Scene'].classList.remove('active');

setTimeout(() => {
DOM[from + 'Scene'].classList.add('hidden');
DOM[to + 'Scene'].classList.remove('hidden');

setTimeout(() => {
DOM[to + 'Scene'].classList.add('active');
STATE.currentScene = to;
if (callback) callback();
}, 200);
}, 1500);
}

// ============================================
// FIREWORKS SHOW
// ============================================

function launchFireworks(count = 25) {
let launched = 0;

const interval = setInterval(() => {
if (launched >= count) {
clearInterval(interval);
return;
}

const x = Math.random() * DOM.canvas.width;
const y = Math.random() * (DOM.canvas.height * 0.6);

STATE.particleSystem.addFirework(x, y);
launched++;
}, 180);
}

// ============================================
// HEART SHOWER
// ============================================

function heartShower() {
let count = 0;
const max = CONFIG.isMobile ? 20 : 35;

const interval = setInterval(() => {
if (count >= max) {
clearInterval(interval);
return;
}
STATE.particleSystem.addHeart(
Math.random() * DOM.canvas.width,
DOM.canvas.height + 40
);
count++;
}, 150);
}

// ============================================
// YES BUTTON - CINEMATIC FLOW
// ============================================

async function handleYesClick() {

DOM.yesBtn.disabled = true;
addRippleEffect({ currentTarget: DOM.yesBtn });

// Dramatic slow motion
STATE.particleSystem.setSlowMotion(true);
DOM.dimOverlay.classList.add('active');

// Peak pause
await new Promise(r => setTimeout(r, 1300));

STATE.particleSystem.setSlowMotion(false);
launchFireworks(35);

setTimeout(() => {
switchScene('main', 'success', async () => {

// Activate cinematic overlays
DOM.grainOverlay.classList.add('active');
DOM.vignetteOverlay.classList.add('active');

// Stage 1: Name reveal
setTimeout(() => {
DOM.successName.classList.add('visible');
}, 800);

// Stage 2: Message
setTimeout(async () => {
await typeWriter(DOM.successMessage, CONFIG.successMessage, 40);
}, 2000);

// Stage 3: Image reveal
setTimeout(() => {
DOM.imageContainer.classList.add('visible');
heartShower();
launchFireworks(20);
}, 4000);

});
}, 1800);

DOM.bgMusic.play().catch(() => {});
stopLoveQuotes();
}

// ============================================
// INTRO CLICK
// ============================================

function handleIntroClick() {
DOM.dimOverlay.classList.add('active');

setTimeout(() => {
DOM.dimOverlay.classList.remove('active');
switchScene('intro', 'main', () => {
updateCountdown();
setInterval(updateCountdown, 60000);
});
}, 1000);
}

// ============================================
// INITIALIZATION
// ============================================

function init() {

detectTimeOfDay();

resizeCanvas();
window.addEventListener('resize', resizeCanvas);

STATE.particleSystem = new ParticleSystem();
animate();

startLoveQuotes();

DOM.introScene.addEventListener('click', handleIntroClick);
DOM.yesBtn.addEventListener('click', handleYesClick);
DOM.yesBtn.addEventListener('click', addRippleEffect);
DOM.noBtn.addEventListener('mouseenter', moveNoButton);
document.addEventListener('mousemove', handleNoProximity);

document.addEventListener('mousemove', trackMouse);
document.addEventListener('touchmove', trackTouch);

document.addEventListener('contextmenu', e => e.preventDefault());
}

if (document.readyState === 'loading') {
document.addEventListener('DOMContentLoaded', init);
} else {
init();
}

window.addEventListener('beforeunload', () => {
if (STATE.animationFrame) cancelAnimationFrame(STATE.animationFrame);
if (STATE.quoteInterval) clearInterval(STATE.quoteInterval);
});

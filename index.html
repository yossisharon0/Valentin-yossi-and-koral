<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>קורל 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;600;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Heebo',sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:linear-gradient(-45deg,#ff6f91,#ff9a9e,#fad0c4,#ffdde1);
background-size:400% 400%;
animation:gradientMove 15s ease infinite;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
backdrop-filter:blur(20px);
background:rgba(255,255,255,0.1);
padding:40px;
border-radius:25px;
text-align:center;
box-shadow:0 0 40px rgba(255,0,100,0.4);
animation:fadeIn 2s ease;
}

@keyframes fadeIn{
from{opacity:0; transform:scale(0.8);}
to{opacity:1; transform:scale(1);}
}

h1{
font-size:32px;
margin-bottom:20px;
text-shadow:0 0 15px rgba(255,255,255,0.8);
}

button{
padding:12px 35px;
margin:15px;
font-size:20px;
border:none;
border-radius:50px;
cursor:pointer;
transition:0.3s;
}

#yes{
background:#ff2e63;
color:white;
box-shadow:0 0 20px #ff2e63;
}

#yes:hover{
transform:scale(1.15);
box-shadow:0 0 40px #ff2e63;
}

#no{
background:white;
color:#ff2e63;
position:absolute;
}

img{
width:280px;
border-radius:20px;
margin-top:20px;
box-shadow:0 0 30px rgba(255,255,255,0.7);
display:none;
animation:pop 1s ease forwards;
}

@keyframes pop{
from{transform:scale(0);}
to{transform:scale(1);}
}

.message{
margin-top:20px;
font-size:22px;
display:none;
animation:fadeIn 2s ease;
}

.bigHeart{
font-size:80px;
animation:beat 1s infinite;
margin-top:20px;
}

@keyframes beat{
0%{transform:scale(1);}
50%{transform:scale(1.2);}
100%{transform:scale(1);}
}

canvas{
position:fixed;
top:0;
left:0;
pointer-events:none;
}

</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="card">
<h1>קורל חיים שלי 💕<br>את פנויה ביום האהבה?</h1>

<button id="yes" onclick="yes()">כן 😍</button>
<button id="no">לא 🙄</button>

<div class="bigHeart" id="heart" style="display:none;">💖</div>

<img id="pic" src="image.JPG">

<div class="message" id="text">
ידעתי שתגידי כן 😍<br>
ביום האהבה אני רוצה להיות רק איתך 🥰<br>
(שבוע אחרי כי אני במילואים 😉)
</div>

</div>

<audio id="song" src="song.mp3"></audio>

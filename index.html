<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>קורל 💖</title>
<style>
body{
    margin:0;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#ffb6c1);
    text-align:center;
    font-family:Arial, sans-serif;
}

h1{
    margin-top:50px;
    font-size:28px;
    background: linear-gradient(90deg,#ff9a9e,#fad0c4,#ffb6c1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation:floatTitle 3s ease-in-out infinite, fadeIn 2s;
}

@keyframes floatTitle{
    0%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0);}
}

@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}

button{
    font-size:22px;
    padding:12px 30px;
    border:none;
    border-radius:30px;
    margin:20px;
    cursor:pointer;
    background:#ff4d6d;
    color:white;
    transition:.3s;
}
button:hover{transform:scale(1.1);}
#no{position:absolute;}

img{
    width:280px;
    border-radius:25px;
    margin-top:20px;
    animation:pop 1s infinite alternate;
    box-shadow:0 0 20px pink;
    display:none; /* מוסתר בהתחלה */
}

@keyframes pop{0%{transform:scale(0);}100%{transform:scale(1);}}

p{
    font-size:22px;
    display:none; /* מוסתר בהתחלה */
}

.heart{
    position:fixed;
    top:-10px;
    font-size:24px;
    animation:fall linear infinite;
}

.star{
    position:fixed;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    top:0;
    animation:fallStar linear infinite;
    opacity:0.8;
}

@keyframes fall{to{transform:translateY(100vh);opacity:0;}}
@keyframes fallStar{to{transform:translateY(100vh);opacity:0;}}

canvas{
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
}

#floatingText{
    position:absolute;
    top:20%;
    width:100%;
    font-size:24px;
    color:#fff;
    text-shadow:0 0 10px #ff6f91,0 0 20px #ff9a9e;
}
</style>
</head>
<body>

<canvas id="fire"></canvas>

<h1>קורל חיים שלי, את פנויה ביום האהבה? 💕</h1>
<div id="floatingText">את עושה לי את הלב שמח כל יום מחדש ❤️</div>

<button onclick="yes()">כן 😍</button>
<button id="no">לא 🙄</button>

<img id="pic" src="image.JPG"> <!-- מוסתר בהתחלה -->

<p id="text">ידעתי שתגידי כן קורל ❤️  
ביום האהבה אני רוצה להיות רק איתך 🥰</p>

<p id="afterYes" style="font-size:22px; color:#ff4d6d; margin-top:10px;">
(שבוע אחרי כי אני במילואים)
</p>

<audio id="song" src="song.mp3"></audio>

<script>
const no=document.getElementById("no");
const text=document.getElementById("text");
const afterYes=document.getElementById("afterYes");
const pic=document.getElementById("pic");
const song=document.getElementById("song");
const floatingText=document.getElementById("floatingText");

// בהתחלה נסתר את הטקסטים והתמונה
text.style.display="none";
afterYes.style.display="none";
pic.style.display="none";

// כפתור "לא" בורח
function move(){
    let x=Math.random()*(window.innerWidth-100);
    let y=Math.random()*(window.innerHeight-100);
    no.style.left=x+"px";
    no.style.top=y+"px";
}
no.addEventListener("mouseover",move);
no.addEventListener("touchstart",move);

// כפתור "כן"
function yes(){
    song.play();
    if(navigator.vibrate) navigator.vibrate([200,100,200,100,400]);
    fireworks();
    explodeHearts();
    // מציג את כל האלמנטים אחרי לחיצה
    text.style.display="block";
    afterYes.style.display="block";
    pic.style.display="block";
}

// לבבות נופלים כל הזמן
setInterval(()=>{
    let h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    h.style.animationDuration=2+Math.random()*3+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),5000);
},200);

// כוכבים ברקע
for(let i=0;i<50;i++){
    let s=document.createElement("div");
    s.className="star";
    s.style.left=Math.random()*100+"vw";
    s.style.animationDuration=3+Math.random()*4+"s";
    document.body.appendChild(s);
}

// זיקוקים
const canvas=document.getElementById("fire");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
function fireworks(){
    for(let i=0;i<150;i++){
        setTimeout(()=>{
            ctx.fillStyle=`hsl(${Math.random()*360},100%,60%)`;
            ctx.beginPath();
            ctx.arc(Math.random()*canvas.width,Math.random()*canvas.height/2,3,0,Math.PI*2);
            ctx.fill();
        },i*15);
    }
    setTimeout(()=>ctx.clearRect(0,0,canvas.width,canvas.height),3000);
}

// לבבות מתפוצצים בכפתור כן
function explodeHearts(){
    for(let i=0;i<30;i++){
        let hb=document.createElement("div");
        hb.className="heart";
        hb.innerHTML="💖";
        hb.style.left=(window.innerWidth/2 + (Math.random()*200-100))+"px";
        hb.style.top=(window.innerHeight/2 + (Math.random()*200-100))+"px";
        hb.style.fontSize=10+Math.random()*30+"px";
        document.body.appendChild(hb);
        setTimeout(()=>hb.remove(),2000);
    }
}

// טקסטים מתחלפים
const messages=["אני אוהב אותך","את מושלמת","קורל 💖","יום האהבה שלנו!"];
let msgIndex=0;
setInterval(()=>{
    floatingText.innerText=messages[msgIndex];
    msgIndex=(msgIndex+1)%messages.length;
},2000);

</script>
</body>
</html>

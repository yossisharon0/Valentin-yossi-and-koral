<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>קורל 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;600;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Heebo',sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:black;
color:white;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

#startScreen{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
cursor:pointer;
z-index:10;
transition:1s;
}

.card{
backdrop-filter:blur(25px);
background:rgba(255,255,255,0.08);
padding:50px;
border-radius:30px;
text-align:center;
box-shadow:0 0 50px rgba(255,0,120,0.4);
display:none;
animation:fadeIn 2s ease forwards;
}

@keyframes fadeIn{
from{opacity:0; transform:scale(0.8);}
to{opacity:1; transform:scale(1);}
}

h1{
font-size:34px;
margin-bottom:20px;
}

.countdown{
font-size:18px;
margin-bottom:25px;
opacity:0.8;
}

button{
padding:14px 40px;
margin:15px;
font-size:20px;
border:none;
border-radius:50px;
cursor:pointer;
transition:0.3s;
}

#yes{
background:#ff2e63;
color:white;
box-shadow:0 0 20px #ff2e63;
}

#yes:hover{
transform:scale(1.15);
box-shadow:0 0 40px #ff2e63;
}

#no{
background:white;
color:#ff2e63;
pointer-events:none; /* אי אפשר ללחוץ */
opacity:0.5;
cursor:not-allowed;
}

.bigHeart{
font-size:90px;
margin-top:20px;
display:none;
animation:beat 1s infinite;
}

@keyframes beat{
0%{transform:scale(1);}
50%{transform:scale(1.25);}
100%{transform:scale(1);}
}

img{
width:280px;
border-radius:25px;
margin-top:20px;
box-shadow:0 0 30px pink;
display:none;
}

.message{
margin-top:20px;
font-size:22px;
display:none;
}

</style>
</head>

<body>

<div id="startScreen">💖 לחצי כאן להתחיל 💖</div>

<canvas id="stars"></canvas>
<canvas id="fireworks"></canvas>

<div class="card" id="mainCard">

<h1>קורל חיים שלי 💕<br>את פנויה ביום האהבה?</h1>

<div class="countdown" id="countdown"></div>

<button id="yes">כן 😍</button>
<button id="no">לא 🙄</button>

<div class="bigHeart" id="heart">💖</div>

<img id="pic" src="image.JPG">

<div class="message" id="text">
ידעתי שתגידי כן 😍<br>
ביום האהבה אני רוצה להיות רק איתך 🥰<br>
(שבוע אחרי כי אני במילואים 😉)
</div>

</div>

<audio id="song" src="song.mp3"></audio>

<script>

/* מסך פתיחה */
const startScreen=document.getElementById("startScreen");
const card=document.getElementById("mainCard");
const song=document.getElementById("song");

startScreen.onclick=()=>{
startScreen.style.opacity="0";
setTimeout(()=>startScreen.style.display="none",1000);
card.style.display="block";
};

/* ספירה לאחור */
const countdown=document.getElementById("countdown");
const target=new Date("Feb 14, 2026 00:00:00").getTime();

setInterval(()=>{
let now=new Date().getTime();
let diff=target-now;

let days=Math.floor(diff/(1000*60*60*24));
let hours=Math.floor((diff%(1000*60*60*24))/(1000*60*60));

countdown.innerHTML="עוד "+days+" ימים ו-"+hours+" שעות ליום האהבה שלנו 💘";
},1000);

/* כפתור כן */
const yesBtn=document.getElementById("yes");
const heart=document.getElementById("heart");
const pic=document.getElementById("pic");
const text=document.getElementById("text");

yesBtn.onclick=()=>{
song.play();
heart.style.display="block";
pic.style.display="block";
text.style.display="block";
document.body.style.transition="1s";
document.body.style.background="linear-gradient(135deg,#ff4e8c,#ff9a9e)";
launchFireworks();
};

/* כוכבים תלת מימד */
const starCanvas=document.getElementById("stars");
const sctx=starCanvas.getContext("2d");
starCanvas.width=window.innerWidth;
starCanvas.height=window.innerHeight;

let stars=[];
for(let i=0;i<150;i++){
stars.push({
x:Math.random()*starCanvas.width,
y:Math.random()*starCanvas.height,
r:Math.random()*2
});
}

function animateStars(){
sctx.clearRect(0,0,starCanvas.width,starCanvas.height);
sctx.fillStyle="white";
stars.forEach(s=>{
sctx.beginPath();
sctx.arc(s.x,s.y,s.r,0,Math.PI*2);
sctx.fill();
s.y+=0.3;
if(s.y>starCanvas.height) s.y=0;
});
requestAnimationFrame(animateStars);
}
animateStars();

/* זיקוקים */
const fireCanvas=document.getElementById("fireworks");
const fctx=fireCanvas.getContext("2d");
fireCanvas.width=window.innerWidth;
fireCanvas.height=window.innerHeight;

function launchFireworks(){
for(let i=0;i<300;i++){
setTimeout(()=>{
fctx.fillStyle=`hsl(${Math.random()*360},100%,60%)`;
fctx.beginPath();
fctx.arc(Math.random()*fireCanvas.width,Math.random()*fireCanvas.height/2,4,0,Math.PI*2);
fctx.fill();
},i*8);
}
setTimeout(()=>fctx.clearRect(0,0,fireCanvas.width,fireCanvas.height),4000);
}

</script>

</body>
</html>

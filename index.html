<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>קורל 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet">

<style>
/* ==================== RESET & VARIABLES ==================== */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
--primary:#ff2e63;--primary-dark:#d81e4f;--secondary:#ff6b9d;--accent:#ffafcc;
--bg-night-start:#0a0015;--bg-night-end:#1a0520;--bg-day-start:#1a0520;--bg-day-end:#2d1b3d;
--white:rgba(255,255,255,0.95);--glass:rgba(255,255,255,0.08);
--transition:cubic-bezier(0.4, 0, 0.2, 1);--bounce:cubic-bezier(0.68, -0.55, 0.265, 1.55);
}
body{
font-family:'Heebo',sans-serif;
min-height:100vh;
overflow:hidden;
background:linear-gradient(135deg, var(--bg-night-start), var(--bg-night-end));
color:var(--white);
position:relative;
transition:background 3s ease;
}

/* ==================== CANVAS ==================== */
#mainCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;}

/* ==================== FILM GRAIN OVERLAY ==================== */
.grain-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background-image:url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noise)" opacity="0.05"/%3E%3C/svg%3E');opacity:0;pointer-events:none;z-index:100;transition:opacity 2s ease;}
.grain-overlay.active{opacity:1;}

/* ==================== VIGNETTE ==================== */
.vignette{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.7) 100%);opacity:0;pointer-events:none;z-index:99;transition:opacity 2s ease;}
.vignette.active{opacity:1;}

/* ==================== SCENES ==================== */
.scene{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:10;opacity:0;pointer-events:none;transition:opacity 1.5s var(--transition);}
.scene.active{opacity:1;pointer-events:auto;}

/* ==================== INTRO SCENE ==================== */
#introScene{background:radial-gradient(circle at center, rgba(255,46,99,0.15), transparent 70%);}
.intro-content{text-align:center;transform:scale(0.9);transition:transform 2.5s var(--transition);}
#introScene.active .intro-content{transform:scale(1);}
.intro-icon{font-size:clamp(70px, 14vw, 110px);margin-bottom:35px;animation:gentlePulse 3.5s ease-in-out infinite;filter:drop-shadow(0 0 35px var(--primary));}
@keyframes gentlePulse{0%, 100%{transform:scale(1);}50%{transform:scale(1.06);}}
.intro-text{font-size:clamp(20px, 4vw, 28px);font-weight:300;letter-spacing:4px;opacity:0.9;margin-bottom:50px;}
.tap-hint{font-size:clamp(15px, 2.8vw, 19px);opacity:0.6;animation:fadeInOut 2.5s ease-in-out infinite;margin-top:25px;font-weight:300;}
@keyframes fadeInOut{0%, 100%{opacity:0.35;}50%{opacity:0.85;}}

/* ==================== MAIN SCENE ==================== */
#mainScene{padding:20px;}
.card{backdrop-filter:blur(35px) saturate(180%);background:var(--glass);border:1px solid rgba(255,255,255,0.2);border-radius:35px;padding:clamp(35px, 7vw, 70px);max-width:650px;width:92%;box-shadow:0 12px 40px rgba(0,0,0,0.4),0 0 80px rgba(255,46,99,0.25),inset 0 0 50px rgba(255,255,255,0.06);text-align:center;transform:translateY(40px);opacity:0;transition:all 1.5s var(--transition);position:relative;}
#mainScene.active .card{transform:translateY(0);opacity:1;}
.card-title{font-size:clamp(26px, 5.5vw, 40px);font-weight:800;line-height:1.6;margin-bottom:30px;background:linear-gradient(135deg, var(--white), var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 2px 25px rgba(255,46,99,0.35));}
.countdown{font-size:clamp(15px, 3vw, 18px);font-weight:400;opacity:0.88;background:rgba(255,46,99,0.18);border:1px solid rgba(255,46,99,0.35);padding:20px 28px;border-radius:20px;margin-bottom:40px;line-height:1.7;}
.button-container{display:flex;flex-direction:column;gap:18px;margin:35px 0;align-items:center;position:relative;min-height:140px;}
.btn{position:relative;padding:18px 55px;font-size:clamp(19px, 3.8vw, 24px);font-weight:600;border:none;border-radius:50px;cursor:pointer;transition:all 0.4s var(--transition);font-family:'Heebo',sans-serif;letter-spacing:0.8px;outline:none;-webkit-tap-highlight-color:transparent;overflow:hidden;z-index:1;}
.btn::before{content:'';position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;background:rgba(255,255,255,0.5);transform:translate(-50%, -50%);transition:width 0.6s, height 0.6s;}
.btn.ripple::before{width:300px;height:300px;}
.btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);transition:left 0.7s;}
.btn:hover::after{left:100%;}
#yesBtn{background:linear-gradient(135deg, var(--primary), var(--secondary));color:white;box-shadow:0 10px 30px rgba(255,46,99,0.45),inset 0 1px 0 rgba(255,255,255,0.35);order:1;}
#yesBtn:hover{transform:translateY(-5px) scale(1.04);box-shadow:0 15px 45px rgba(255,46,99,0.65),inset 0 1px 0 rgba(255,255,255,0.35);}
#yesBtn:active{transform:translateY(-3px) scale(1.02);}
#noBtn{position:absolute;background:rgba(255,255,255,0.13);color:var(--white);border:1px solid rgba(255,255,255,0.35);box-shadow:0 6px 20px rgba(0,0,0,0.25);opacity:0.75;cursor:pointer;transition:all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);order:2;}
#noBtn.escaping{opacity:0.6;}
#noBtn.defeated{transform:scale(0.85);opacity:0.4;filter:blur(1px);pointer-events:none;}
.btn-hint{font-size:clamp(13px, 2.4vw, 15px);opacity:0.52;margin-top:8px;font-weight:300;}

/* ==================== DIM OVERLAY ==================== */
.dim-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);z-index:9;opacity:0;pointer-events:none;transition:opacity 1.2s var(--transition);}
.dim-overlay.active{opacity:1;}

/* ==================== SUCCESS SCENE ==================== */
#successScene{background:transparent;}
.success-content{text-align:center;max-width:700px;padding:25px;position:relative;}
.success-name{font-family:'Crimson Text', serif;font-size:clamp(50px, 12vw, 90px);font-weight:600;margin-bottom:40px;opacity:0;transform:scale(0.85);transition:all 2s var(--transition);background:linear-gradient(135deg, #fff, #ffafcc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 50px rgba(255,46,99,0.7));letter-spacing:3px;}
.success-name.visible{opacity:1;transform:scale(1);}
.success-message{font-size:clamp(22px, 4.5vw, 32px);font-weight:400;line-height:2;margin-bottom:50px;opacity:0;min-height:80px;font-family:'Heebo', sans-serif;}
.success-message.visible{opacity:1;}
.image-container{position:relative;display:inline-block;opacity:0;transform:scale(1.15);filter:blur(20px);transition:all 2.5s var(--transition);}
.image-container.visible{opacity:1;transform:scale(1);filter:blur(0);}
.image-frame{position:relative;padding:15px;background:rgba(255,255,255,0.1);backdrop-filter:blur(25px);border-radius:30px;border:2px solid rgba(255,255,255,0.25);box-shadow:0 25px 80px rgba(0,0,0,0.6),0 0 100px rgba(255,46,99,0.4),inset 0 0 60px rgba(255,255,255,0.08);}
.success-image{width:100%;max-width:400px;border-radius:20px;display:block;box-shadow:0 15px 50px rgba(0,0,0,0.5);}
.image-reflection{position:absolute;bottom:-50px;left:50%;transform:translateX(-50%) scaleY(-1);width:90%;height:50px;background:linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);filter:blur(10px);opacity:0.4;border-radius:20px;pointer-events:none;}

/* ==================== LOVE QUOTES BACKGROUND ==================== */
.love-quote{position:fixed;top:50%;left:50%;transform:translate(-50%, -50%);font-size:clamp(24px, 4.5vw, 42px);font-weight:300;color:rgba(255,255,255,0.12);text-align:center;z-index:0;pointer-events:none;letter-spacing:3px;max-width:85vw;white-space:nowrap;opacity:0;transition:opacity 2.5s var(--transition);}
.love-quote.visible{opacity:1;}

/* ==================== RESPONSIVE ==================== */
@media (min-width:768px){.button-container{flex-direction:row;justify-content:center;}}
@media (max-height:750px){.card{padding:30px;}.card-title{margin-bottom:20px;}.countdown{margin-bottom:25px; padding:15px 22px;}.button-container{margin:25px 0; gap:15px; min-height:100px;}}
@media (max-width:400px){.btn{padding:16px 45px;}}
</style>
</head>
<body>

<canvas id="mainCanvas"></canvas>
<div class="grain-overlay" id="grainOverlay"></div>
<div class="vignette" id="vignetteOverlay"></div>
<div class="love-quote" id="loveQuote"></div>
<div class="dim-overlay" id="dimOverlay"></div>

<div class="scene active" id="introScene">
  <div class="intro-content">
    <div class="intro-icon">💖</div>
    <div class="intro-text">משהו מיוחד מחכה לך</div>
    <div class="tap-hint">לחצי להמשיך</div>
  </div>
</div>

<div class="scene" id="mainScene">
  <div class="card">
    <h1 class="card-title">קורל חיים שלי 💕<br>את פנויה ביום האהבה?</h1>
    <div class="countdown" id="countdown"></div>
    <div class="button-container" id="buttonContainer">
      <button class="btn" id="yesBtn">כן 😍</button>
      <button class="btn" id="noBtn">לא 🙄</button>
    </div>
    <div class="btn-hint">רמז: יש רק תשובה נכונה אחת 😉</div>
  </div>
</div>

<div class="scene" id="successScene">
  <div class="success-content">
    <div class="success-name" id="successName">קורל</div>
    <div class="success-message" id="successMessage"></div>
    <div class="image-container" id="imageContainer">
      <div class="image-frame">
        <img class="success-image" src="image.JPG" alt="קורל ואני">
        <div class="image-reflection"></div>
      </div>
    </div>
  </div>
</div>

<audio id="bgMusic" src="song.mp3" preload="auto"></audio>

<script>
// ============================================

</script>

</body>
</html>
